services:

  generate-certs:
    build:
      context: ./certs
      dockerfile: Dockerfile
    volumes:
      - ./certs/output:/certs

  redis:
    image: redis:8.4.0-alpine
    container_name: redis-ssl
    ports:
      - "6379:6379"
    volumes:
      - ./certs/output:/tls:ro
    depends_on:
      generate-certs:
        condition: service_completed_successfully
    command: >
      redis-server
      --tls-port 6379
      --port 0
      --tls-cert-file /tls/redis-cert.pem
      --tls-key-file /tls/redis-key.pem
      --tls-ca-cert-file /tls/root-cert.pem
      --tls-auth-clients no
    restart: always

  # user-api-release:
  #   build:
  #     context: ../app
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     generate-certs:
  #       condition: service_completed_successfully
  #   # This ensures the container restarts if it crashes
  #   restart: always

  user-api-dev:
    build:
      context: ../app
      dockerfile: Dockerfile_dev
    ports:
      - "8080:8080"
    volumes:
      - ../app:/usr/src/app
    depends_on:
      generate-certs:
        condition: service_completed_successfully
    # This ensures the container restarts if it crashes
    restart: always